<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyTravels Login</title>
  <link rel="icon" type="image/png" href="/mnt/data/a_clean_modern_3d_styled_corporate_logo_design_o.png">
  <link rel="icon" type="image/png" href="images/e-log.png">
  <link rel="stylesheet" href="css/bootstrap.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="css/font-awesome.min.css" rel="stylesheet" />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Roboto', sans-serif;
    }

    body{
      background:url('images/slider-bg.jpg') no-repeat center center/cover;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    body::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
    }

    .login-container{
      position:relative;
      width:400px;
      background:#ffffff;
      padding:40px;
      border-radius:15px;
      box-shadow:0 5px 20px rgba(0,0,0,0.3);
      z-index:1;
    }

    .login-container h2{
      text-align:center;
      margin-bottom:30px;
      color:#0a97b0;
      font-weight:700;
    }

    .input-box{
      margin-bottom:20px;
    }

    .input-box input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      font-size:16px;
    }

    .input-box input:focus{
      border-color:#0a97b0;
    }

    .btn-login{
      width:100%;
      padding:12px;
      background:#0a97b0;
      color:#fff;
      border:none;
      border-radius:8px;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .btn-login:hover{
      background:#087a8d;
    }

    .bottom-text{
      text-align:center;
      margin-top:20px;
      font-size:14px;
    }

    .bottom-text a{
      color:#0a97b0;
      text-decoration:none;
      font-weight:600;
    }

    .success-message{
      margin-top:15px;
      text-align:center;
      color:green;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>EasyTravels Login</h2>

    <form id="loginForm">
      <div class="input-box">
        <input type="text" id="username" placeholder="Create Username" required>
      </div>

      <div class="input-box">
        <input type="password" id="password" placeholder="Create Password" required>
      </div>

      <button type="submit" class="btn-login">Create Account</button>

      <div class="success-message" id="successMessage"></div>
    </form>

    <div class="bottom-text">
      Back to <a href="index.html">Home</a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event){
      event.preventDefault();

      var username = document.getElementById("username").value;
      var password = document.getElementById("password").value;

      if(username !== "" && password !== ""){
        document.getElementById("successMessage").innerHTML =
        "Account created successfully";

        localStorage.setItem("easytravelsUser", username);
        localStorage.setItem("easytravelsPass", password);
      }
    });
  </script>

</body>
</html>
